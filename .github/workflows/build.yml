name: build

# The site is plain HTML committed to the repository root and served by
# GitHub Pages straight from `main`. This check fails when someone edits
# src/ without rebuilding, so the committed HTML never drifts from source.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r src/requirements.txt
      - run: python src/build.py
      - name: Committed HTML matches a fresh build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files are stale. Run 'python3 src/build.py' and commit the result."
            exit 1
          fi
